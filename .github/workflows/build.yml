name: Build

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-21
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: course-management-jar
          path: target/*.jar
          retention-days: 5

  sast:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Semgrep Security Scan
        run: semgrep --config p/default --sarif --output=semgrep.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()

  dependency-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure environment for offline scan
        run: |
          # Создаём пустую директорию данных, чтобы плагин не пытался обновлять
          mkdir -p ~/.dependency-check/data
          # Устанавливаем переменные окружения для офлайн-режима
          echo "OWASP_DC_SKIP_UPDATE=true" >> $GITHUB_ENV
          echo "dependencyCheckSkipUpdate=true" >> $GITHUB_ENV

      - name: Run OWASP Dependency Check (OFFLINE mode)
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -Dodc.skipUpdate=true \
            -DdependencyCheck.skipUpdate=true \
            -DdependencyCheck.autoUpdate=false \
            -DdependencyCheck.nvd.api.enabled=false \
            -DdependencyCheck.nvd.api.key="" \
            -DdependencyCheck.nvd.api.delay=0 \
            -DdependencyCheck.failOnError=false \
            -DdependencyCheck.format=HTML \
            -DdependencyCheck.outputDirectory=target \
            -DdependencyCheck.outputName=dependency-check-report \
            -DdependencyCheck.suppressionFiles=dependency-check-suppressions.xml

      - name: Verify report creation
        run: |
          echo "=== Checking target directory ==="
          ls -la target/ 2>/dev/null || echo "Target directory doesn't exist"
          echo "=== Looking for dependency check reports ==="
          find . -type f -name "*dependency*" 2>/dev/null | head -20 || echo "No reports found"

      - name: Upload ALL possible reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-artifacts
          path: |
            target/
            **/dependency-check-report*
            **/*dependency*check*
          retention-days: 5